name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  JOERN_VERSION: v4.0.583
  JOERN_SHA256: 74e072163b7f1fc1a371a265ca6f1a94a54507eb20bb831babb288d40f4d278e
  JOERN_SHA512: 5eb2fb4b2011585d11cc7e5ea21af99afc66cee7535ff0a2724647952590c300a84afe23df3317d19667a55b8b5bac46b74172e63a687282753ec9f544314c3a

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz openjdk-21-jdk-headless unzip

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/joern/${{ env.JOERN_VERSION }}/joern-cli.zip
          key: joern-${{ runner.os }}-${{ env.JOERN_VERSION }}-${{ env.JOERN_SHA256 }}

      - name: Install verified Joern
        run: |
          mkdir -p "$HOME/.cache/joern/$JOERN_VERSION"
          mkdir -p "$HOME/.local/share/joern/$JOERN_VERSION"
          mkdir -p "$HOME/.local/bin"
          archive="$HOME/.cache/joern/$JOERN_VERSION/joern-cli.zip"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --retry 5 \
              --output "$archive" \
              "https://github.com/joernio/joern/releases/download/$JOERN_VERSION/joern-cli.zip"
          fi
          printf '%s  %s\n' "$JOERN_SHA256" "$archive" | sha256sum --check -
          printf '%s  %s\n' "$JOERN_SHA512" "$archive" | sha512sum --check -
          unzip -q -o "$archive" -d "$HOME/.local/share/joern/$JOERN_VERSION"
          for executable in joern joern-parse joern-export joern-scan; do
            ln -s "$HOME/.local/share/joern/$JOERN_VERSION/joern-cli/$executable" \
              "$HOME/.local/bin/$executable"
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install project
        run: python -m pip install '.[dev]'

      - name: Joern health
        run: |
          joern-agent doctor --json
          joern-parse --list-languages

      - name: Format
        run: ruff format --check .

      - name: Lint and security rules
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Unit and real Joern integration tests
        run: pytest --cov=joern_agent_bridge --cov-report=term-missing --cov-report=xml

      - name: Build distributions
        run: python -m build

      - name: Audit Python dependencies
        run: pip-audit --local --skip-editable

      - name: Scan repository for secrets
        run: |
          detect-secrets scan \
            --exclude-lines 'JOERN_SHA(256|512)' \
            --exclude-files 'examples/results/(baseline|post)\.json' \
            > /tmp/detect-secrets.json
          test "$(jq '[.results[] | length] | add // 0' /tmp/detect-secrets.json)" -eq 0

      - name: Verify built wheel
        run: |
          python -m venv /tmp/joern-agent-wheel
          /tmp/joern-agent-wheel/bin/pip install dist/*.whl
          /tmp/joern-agent-wheel/bin/joern-agent --help

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: safe-test-reports
          path: |
            coverage.xml
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
